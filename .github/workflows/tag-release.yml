name: Tag release

# When a "Release X.Y.Z" commit (from the bump pull request) lands on main and
# the tag does not exist yet, create the tag vX.Y.Z and start release.yml on it.
#
# Why the explicit start: a tag created with the built-in token does not start
# any other workflow (GitHub blocks that on purpose, so a token cannot trigger
# runs by itself). So after creating the tag this job asks for a release run
# with a workflow_dispatch on the tag ref. Running on the tag (not on main)
# means the release workflow, the built source and the commit in the build
# attestations are exactly the tagged commit.
#
# The tag is created through the API, so no credential is left in the checkout.
on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the release commit and start the build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # create the tag
      actions: write    # start release.yml (workflow_dispatch)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create the tag and start the release build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          subject="${MESSAGE%%$'\n'*}"
          # "Release 0.8.1", also as a squash merge title: "Release 0.8.1 (#12)",
          # or a plain merge commit: "Merge pull request #12 from OWNER/release/v0.8.1".
          if [[ "$subject" =~ ^Release\ ([0-9]+\.[0-9]+\.[0-9]+)(\ \(#[0-9]+\))?$ ]]; then
            version="${BASH_REMATCH[1]}"
          elif [[ "$subject" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\ [^/]+/release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Not a release commit. Nothing to do."; exit 0
          fi
          tag="v$version"
          cargo_version=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -n 1)
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::Commit says $version but Cargo.toml says $cargo_version."; exit 1
          fi
          python3 scripts/release-notes.py "$version" > /dev/null
          python3 scripts/bump-version.py "$version" --check-site
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > /dev/null 2>&1; then
            # The tag must point at THIS commit. Anything else is a tag made by someone else first.
            ref_type=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.type)
            ref_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object.sha)
            if [ "$ref_type" = "tag" ]; then
              ref_sha=$(gh api "repos/$GH_REPO/git/tags/$ref_sha" --jq .object.sha)
            fi
            if [ "$ref_sha" != "$COMMIT_SHA" ]; then
              echo "::error::Tag $tag already exists but points at $ref_sha, not at this release commit $COMMIT_SHA. Investigate before releasing."; exit 1
            fi
            echo "Tag $tag already exists on this commit. Nothing to do."; exit 0
          fi
          # An annotated tag object, then the ref that points to it.
          object=$(gh api "repos/$GH_REPO/git/tags" \
            -f tag="$tag" -f message="Secblitz $version" -f object="$COMMIT_SHA" -f type=commit --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$object" > /dev/null
          echo "Created $tag on $COMMIT_SHA."
          gh workflow run release.yml --ref "refs/tags/$tag" -f "tag=$tag"
          echo "Started the release build for $tag."
