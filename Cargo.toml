[package]
name = "secblitz"
version = "0.7.0"
edition = "2021"
description = "A safer PC. Without headaches."
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
png = "0.17"
semver = "1"
sha2 = "0.10"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "svg", "advanced", "thread-pool", "crisp", "image-without-codecs"] }
# Direct wgpu use is limited to the quick adapter probe in src/gui/render.rs.
wgpu = { version = "27", default-features = false, features = ["std", "dx12", "vulkan"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Host builds/tests only; the Windows binary has no X11/Wayland code.
iced = { version = "0.14", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_RemoteDesktop", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Time", "Win32_Security_Cryptography", "Win32_Security_Isolation"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Local fix for iced's CPU renderer: full-frame repaint on change (see
# vendor/iced_tiny_skia/src/window/compositor.rs, "Secblitz patch").
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
