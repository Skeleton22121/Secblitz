[package]
name = "secblitz"
version = "0.6.1"
edition = "2021"
description = "A safer PC. Without headaches."
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.18"
console = "0.15"
dialoguer = { version = "0.11", default-features = false }
fs2 = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
base64 = "0.22"
ed25519-dalek = "2"
hex = "0.4"
semver = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Power", "Win32_System_Registry"] }

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
