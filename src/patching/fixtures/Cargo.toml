# Standalone patching harness: builds the production library, not coordinator CLI.
[package]
name = "secblitz-patching-tests"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "../../../tests/patching.rs"

[dependencies]
secblitz = { path = "../../.." }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Power", "Win32_System_Registry"] }
